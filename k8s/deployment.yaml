apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-enterprise-api
  namespace: dev
  labels:
    app: devops-enterprise-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-enterprise-api
  template:
    metadata:
      labels:
        app: devops-enterprise-api
    spec:
      # Credenciales de acceso para descargar la imagen privada desde AWS ECR
      imagePullSecrets:
        - name: aws-ecr-secret
      containers:
        - name: api
          # La etiqueta IMAGE_TAG será sustituida dinámicamente por el Jenkinsfile
          image: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/devops-enterprise-api:BUILD_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Comprobaciones sanitarias de Kubernetes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10